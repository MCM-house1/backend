spring:
  profiles:
    active: dev            # 로컬 빠른 실행(H2). 공용/운영은 --spring.profiles.active=mysql

server:
  port: 8080

# ===== AI 아이덴티티 분석 =====
# provider를 바꾸면 LLM 제공자가 교체된다. (지원: gemini, mock)
# api-key가 비어 있으면 provider와 무관하게 mock으로 동작하므로,
# 키 없이도 서버는 정상 기동하고 전체 플로우를 테스트할 수 있다.
#
# Gemini 무료 키 발급: https://aistudio.google.com/apikey
# 발급 후 환경변수 설정:  setx GEMINI_API_KEY "발급받은_키"   (설정 후 터미널 재시작)
llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${GEMINI_API_KEY:}
  model: ${LLM_MODEL:gemini-2.0-flash}
  timeout-seconds: 20

---
# ===== dev: H2 인메모리 (DB 설치 없이 바로 실행) =====
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mcm;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true       # http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true

---
# ===== mysql: 공용/운영 =====
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/mcm_house?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
