spring:
  profiles:
    active: dev            # 로컬 빠른 실행(H2). 공용/운영은 --spring.profiles.active=mysql
  config:
    # 프로젝트 루트의 local.yml에 개인 설정(API 키 등)을 둔다.
    # optional: 이므로 파일이 없어도 기동에 문제가 없고, .gitignore에 있어 커밋되지 않는다.
    # 팀원은 local.yml.example을 복사해 자기 키만 채우면 된다.
    import: optional:file:./local.yml

server:
  port: 8080

# ===== AI 아이덴티티 분석 =====
# provider를 바꾸면 LLM 제공자가 교체된다. (지원: gemini, mock)
# api-key가 비어 있으면 provider와 무관하게 mock으로 동작하므로,
# 키 없이도 서버는 정상 기동하고 전체 플로우를 테스트할 수 있다.
#
# 키를 넣는 방법은 두 가지이며, local.yml이 환경변수보다 우선한다.
#   1) local.yml  (권장: 이 프로젝트에만 적용, 팀원별로 각자 관리)
#   2) 환경변수 GEMINI_API_KEY  (계정 전역에 적용됨)
#
# Gemini 무료 키 발급: https://aistudio.google.com/apikey
llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${GEMINI_API_KEY:}
  # 404(모델 퇴역)가 나기 시작하면 아래로 현재 쓸 수 있는 모델을 확인해 교체:
  #   curl "https://generativelanguage.googleapis.com/v1beta/models?key=발급받은_키"
  # 대안: gemini-flash-latest (퇴역 없음, 대신 트래픽 몰려 503이 잦음)
  model: ${LLM_MODEL:gemini-2.5-flash}
  timeout-seconds: 20

---
# ===== dev: H2 인메모리 (DB 설치 없이 바로 실행) =====
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mcm;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true       # http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true

---
# ===== mysql: 공용/운영 =====
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/mcm_house?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
